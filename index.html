<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e8ede2" />
    <title>Memory Jog</title>
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('memoryJogTheme');
          if (theme && /^[a-z-]+$/.test(theme)) {
            document.documentElement.setAttribute('data-theme', theme);
          }
          const motion = localStorage.getItem('memoryJogMotion');
          if (motion && /^[a-z-]+$/.test(motion)) {
            document.documentElement.setAttribute('data-motion', motion);
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
